// HELPERS ============================================
function rupee(n) { return '\u20B9' + Number(n).toLocaleString('en-IN'); }
function initials(name) {
  return name.split(/[\s\/]/).filter(Boolean).slice(0,2).map(w => w[0]).join('').toUpperCase();
}
function getMember(id) { return members.find(m => m.id === id); }
function getPayment(id) { return payments.find(p => p.id === id); }
function getMemberPay(mid) { return payments.filter(p => p.memberId === mid); }
function isPaidThisMonth(mid) {
  return payments.some(p => p.memberId === mid && p.month === CURRENT_MONTH - 1);
}
function totalCollected() { return payments.reduce((s, p) => s + p.amount, 0); }
function thisMonthCollected() {
  return payments.filter(p => p.month === CURRENT_MONTH - 1).reduce((s, p) => s + p.amount, 0);
}
function totalDue() {
  let d = 0;
  members.forEach(m => {
    for (let i = 0; i < CURRENT_MONTH; i++) {
      if (!payments.find(p => p.memberId === m.id && p.month === i)) d += MONTHLY_AMT;
    }
  });
  return d;
}
function totalExpenses() { return expenses.reduce((s, e) => s + e.amount, 0); }
function getMemberDueMonths(mid) {
  const due = [];
  for (let i = 0; i < CURRENT_MONTH; i++) {
    if (!payments.find(p => p.memberId === mid && p.month === i)) due.push(i);
  }
  return due;
}

function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
}

function sendWhatsApp(phone, message) {
  // If phone is empty, open generic WhatsApp; else open chat with that number
  const cleanPhone = phone ? phone.replace(/\D/g, '') : '';
  let phoneWithCode = cleanPhone;
  if (cleanPhone && cleanPhone.length === 10) phoneWithCode = '91' + cleanPhone;
  const url = phoneWithCode 
    ? `https://wa.me/${phoneWithCode}?text=${encodeURIComponent(message)}`
    : `https://wa.me/?text=${encodeURIComponent(message)}`;
  window.open(url, '_blank');
}

// DUES ===============================================
function renderDues() {
  const overdue3plus = [];
  const overdueAll = [];
  
  members.forEach(m => {
    const due = getMemberDueMonths(m.id);
    if (due.length > 0) {
      overdueAll.push({ m, months: due });
      if (due.length >= 3) overdue3plus.push({ m, months: due });
    }
  });
  
  const totalDueAmt = overdueAll.reduce((s, d) => s + d.months.length * MONTHLY_AMT, 0);
  
  return `
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label"><i class="ti ti-alert-triangle"></i>Total outstanding</div>
      <div class="stat-val red">${rupee(totalDueAmt)}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label"><i class="ti ti-users"></i>Members with dues</div>
      <div class="stat-val amber">${overdueAll.length}</div>
    </div>
  </div>
  
  ${overdue3plus.length > 0 ? `
  <div class="section-label" style="color:#A32D2D">
    <span><i class="ti ti-alert-octagon" style="font-size:13px"></i> Critical: 3+ months overdue</span>
  </div>
  <div class="card" style="border-color:#F09595">
    ${overdue3plus.map(d => `
      <div class="due-row" style="background:#FFF7F5">
        <div class="avatar" style="background:#FCEBEB;color:#A32D2D">${initials(d.m.name)}</div>
        <div class="due-info">
          <div class="due-name">${d.m.name}</div>
          <div class="due-sub">Flat ${d.m.flat} · ${d.months.length} months · ${rupee(d.months.length * MONTHLY_AMT)}</div>
        </div>
        <button class="btn sm" style="background:#A32D2D;color:#fff;border-color:#A32D2D" onclick="event.stopPropagation();sendOverdueWarning(${d.m.id})">
          <i class="ti ti-brand-whatsapp"></i> Warn
        </button>
      </div>
    `).join('')}
  </div>
  ` : ''}
  
  <div class="section-label">All outstanding dues</div>
  <div class="card">
    ${overdueAll.length === 0 ?
      `<div class="empty"><i class="ti ti-circle-check"></i>All dues cleared!</div>` :
      overdueAll.map(d => `
        <div class="due-row">
          <div class="avatar ${d.m.type === 'rented' ? 'rented' : ''}">${initials(d.m.name)}</div>
          <div class="due-info">
            <div class="due-name">${d.m.name}</div>
            <div class="due-sub">Flat ${d.m.flat} · ${d.months.length} month${d.months.length > 1 ? 's' : ''} · ${d.months.map(mo => MONTHS[mo]).join(', ')}</div>
          </div>
          <button class="btn sm icon-only whatsapp" onclick="event.stopPropagation();sendReminder(${d.m.id})" title="Send reminder">
            <i class="ti ti-brand-whatsapp"></i>
          </button>
          <button class="btn sm primary" onclick="event.stopPropagation();openPaymentModalFor(${d.m.id}, ${d.months[0]})">Collect</button>
        </div>
      `).join('')
    }
  </div>`;
}

    <div class="stat-card compact">
      <div class="stat-label"><i class="ti ti-equal"></i>Balance</div>

function selectPayMode(mode) {
  document.getElementById('pm-mode').value = mode;
  document.getElementById('pm-mode-cash').classList.toggle('active', mode === 'cash');
  document.getElementById('pm-mode-bank').classList.toggle('active', mode === 'bank');
}

function handleAttachment(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    currentAttachment = ev.target.result;
    const zone = document.getElementById('pm-att-zone') || document.getElementById('ex-att-zone');
    if (zone) {
      zone.classList.add('has-file');
      zone.innerHTML = `
        <i class="ti ti-photo-check"></i>
        <div style="font-size:13px;font-weight:500">Attached</div>
        <img src="${ev.target.result}" class="attachment-preview">
        <div style="margin-top:6px"><button class="btn sm" onclick="event.stopPropagation();removeAttachment()"><i class="ti ti-x"></i> Remove</button></div>
      `;
    }
  };
  reader.readAsDataURL(file);
}

function removeAttachment() {
  currentAttachment = null;
  const fileInput = document.getElementById('pm-attachment') || document.getElementById('ex-attachment');
  if (fileInput) fileInput.value = '';
  const zone = document.getElementById('pm-att-zone') || document.getElementById('ex-att-zone');
  if (zone) {
    zone.classList.remove('has-file');
    zone.innerHTML = `
      <i class="ti ti-camera-plus"></i>
      <div style="font-size:13px;font-weight:500">Attach screenshot or photo</div>
      <div style="font-size:11px;color:#6A6A65;margin-top:2px">Bank transfer screenshot, cash receipt photo</div>
    `;
  }
}

function savePayment() {
  const mid = parseInt(document.getElementById('pm-m').value);
  const mo = parseInt(document.getElementById('pm-mo').value);
  const amt = parseInt(document.getElementById('pm-amt').value);
  const rec = document.getElementById('pm-rec').value.trim();
  const dt = document.getElementById('pm-dt').value;
  const mode = document.getElementById('pm-mode').value;
  const note = document.getElementById('pm-note').value.trim();
  const err = document.getElementById('pm-err');

  if (!mid) { err.textContent = 'Please select a member'; err.style.display = 'block'; return; }
  if (!amt || amt <= 0) { err.textContent = 'Enter a valid amount'; err.style.display = 'block'; return; }
  if (payments.find(p => p.memberId === mid && p.month === mo)) {
    err.textContent = 'Already recorded for this month'; err.style.display = 'block'; return;
  }

  const newPayment = {
    id: nextId++, memberId: mid, month: mo, amount: amt,
    receipt: rec || String(nextReceipt), date: dt, mode, note,
    attachment: currentAttachment
  };
  payments.push(newPayment);
  nextReceipt++;
  
  // Auto-add to bank if bank transfer
  if (mode === 'bank') bankBalance += amt;
  
  saveData();
  closeSheetDirect();
  render();
  showToast('Payment saved \u2713', 'success');
  
  // Ask about WhatsApp receipt
  setTimeout(() => offerWhatsAppReceipt(newPayment), 300);
}

function updateMember(mid) {
  const m = getMember(mid);
  const name = document.getElementById('em-name').value.trim();
  const flat = document.getElementById('em-flat').value.trim();
  const ph = document.getElementById('em-ph').value.trim();
  const type = document.getElementById('em-type').value;
  const err = document.getElementById('em-err');
  
  if (!name) { err.textContent = 'Name is required'; err.style.display = 'block'; return; }
  if (!flat) { err.textContent = 'Flat number is required'; err.style.display = 'block'; return; }
  if (members.some(x => x.flat === flat && x.id !== mid)) {
    err.textContent = 'Flat ' + flat + ' is already registered'; err.style.display = 'block'; return;
  }
  
  m.name = name; m.flat = flat; m.phone = ph; m.type = type;
  saveData();
  closeSheetDirect();
  render();

function deleteMember(mid) {
  const m = getMember(mid);
  if (!confirm(`Delete ${m.name}?\n\nThis will also delete all their payment records. This cannot be undone.`)) return;
  members = members.filter(x => x.id !== mid);
  payments = payments.filter(p => p.memberId !== mid);
  saveData();
  closeSheetDirect();
  render();
  showToast('Member deleted', 'error');
}

          ${MONTHS.map((_, i) => {
            const future = i >= CURRENT_MONTH;
            const paid = mp.find(p => p.month === i);
            const bg = future ? '#E8E7E1' : (paid ? '#5DCAA5' : '#F09595');
            return `<div style="text-align:center">
              <div style="font-size:10px;color:#6A6A65;margin-bottom:3px">${MONTHS[i][0]}</div>
              <div style="height:20px;border-radius:3px;background:${bg}" title="${MONTHS[i]}"></div>
            </div>`;
          }).join('')}
        </div>
        
        ${MONTHS.slice(0, CURRENT_MONTH).map((mo, i) => {
          const p = mp.find(x => x.month === i);
          return `<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #F0EFE9">
            <div style="flex:1;min-width:0">
              <div style="font-size:14px;font-weight:500">${mo} 2026</div>
              ${p ? `<div style="font-size:11px;color:#6A6A65;margin-top:2px">#${p.receipt} · ${formatDate(p.date)}<span class="pay-mode-tag ${p.mode || 'cash'}" style="margin-left:6px">${(p.mode || 'cash').toUpperCase()}</span></div>` : '<div style="font-size:11px;color:#A32D2D;margin-top:2px">Pending</div>'}
            </div>
            ${p ? `<span style="font-size:15px;font-weight:600;color:#0F6E56">${rupee(p.amount)}</span>
              <button class="btn sm icon-only" style="margin-left:6px" onclick="openPaymentDetail(${p.id})"><i class="ti ti-eye"></i></button>` :
              `<button class="btn sm primary" onclick="closeSheetDirect();openPaymentModalFor(${mid}, ${i})">Collect</button>`}
          </div>`;
        }).join('')}
      </div>
      <div class="sheet-footer">
        <button class="btn whatsapp" onclick="sendHistory(${mid})"><i class="ti ti-brand-whatsapp"></i> Send Summary</button>
        <button class="btn primary" onclick="closeSheetDirect();openPaymentModalFor(${mid})"><i class="ti ti-plus"></i> Record Payment</button>
      </div>
    </div>
  </div>`;
}

// PAYMENT DETAIL =====================================
function openPaymentDetail(pid) {
  const p = getPayment(pid);
  const m = getMember(p.memberId);
  const root = document.getElementById('modal-root');
  root.innerHTML = `
  <div class="modal-wrap" onclick="closeSheet(event)">
    <div class="modal-sheet" onclick="event.stopPropagation()">
      <div class="sheet-handle"></div>
      <div class="sheet-title">
        Payment details
        <button onclick="closeSheetDirect()" style="background:none;border:none;cursor:pointer;color:#6A6A65;padding:4px"><i class="ti ti-x" style="font-size:22px"></i></button>
      </div>
      <div class="sheet-body">
        <div class="receipt-preview">
          <div class="head">📄 Receipt #${p.receipt}</div>
          <div class="summary-row"><span style="color:#6A6A65">Member</span><span style="font-weight:500">${m.name}</span></div>
          <div class="summary-row"><span style="color:#6A6A65">Flat</span><span>${m.flat} (${m.type === 'owner' ? 'Owner' : 'Tenant'})</span></div>
          <div class="summary-row"><span style="color:#6A6A65">Period</span><span>${MONTHS[p.month]} ${YEAR}</span></div>
          <div class="summary-row"><span style="color:#6A6A65">Date</span><span>${formatDate(p.date)}</span></div>
          <div class="summary-row"><span style="color:#6A6A65">Mode</span><span class="pay-mode-tag ${p.mode || 'cash'}">${(p.mode || 'cash').toUpperCase()}</span></div>
          ${p.note ? `<div class="summary-row"><span style="color:#6A6A65">Note</span><span>${p.note}</span></div>` : ''}
          <div class="summary-row total"><span>Amount paid</span><span style="color:#0F6E56">${rupee(p.amount)}</span></div>
        </div>
        ${p.attachment ? `
          <div class="field">
            <label>Attachment</label>
            <img src="${p.attachment}" style="width:100%;border-radius:10px;border:1px solid #E8E7E1">
          </div>
        ` : ''}
      </div>
      <div class="sheet-footer">
        <button class="btn danger" onclick="deletePayment(${pid})"><i class="ti ti-trash"></i></button>
        <button class="btn whatsapp" onclick="sendReceipt(${pid})"><i class="ti ti-brand-whatsapp"></i> Send</button>
        <button class="btn primary" onclick="openEditPayment(${pid})"><i class="ti ti-edit"></i> Edit</button>
      </div>
    </div>
  </div>`;
}

function openEditPayment(pid) {
  const p = getPayment(pid);
  closeSheetDirect();
  currentAttachment = p.attachment;
  setTimeout(() => {
    const root = document.getElementById('modal-root');
    root.innerHTML = `
    <div class="modal-wrap" onclick="closeSheet(event)">
      <div class="modal-sheet" onclick="event.stopPropagation()">
        <div class="sheet-handle"></div>
        <div class="sheet-title">
          Edit payment
          <button onclick="closeSheetDirect()" style="background:none;border:none;cursor:pointer;color:#6A6A65;padding:4px"><i class="ti ti-x" style="font-size:22px"></i></button>
        </div>
        <div class="sheet-body">
          <div class="field">
            <label>Member</label>
            <select id="ep-m">
              ${members.map(m => `<option value="${m.id}"${p.memberId === m.id ? ' selected' : ''}>${m.name} - Flat ${m.flat}</option>`).join('')}
            </select>
          </div>
          <div class="field">
            <label>Payment mode</label>
            <div class="pay-mode-toggle">
              <div class="pay-mode-btn ${(p.mode || 'cash') === 'cash' ? 'active' : ''}" id="ep-mode-cash" onclick="selectEditPayMode('cash')">
                <i class="ti ti-cash"></i>Cash
              </div>
              <div class="pay-mode-btn ${p.mode === 'bank' ? 'active' : ''}" id="ep-mode-bank" onclick="selectEditPayMode('bank')">
                <i class="ti ti-building-bank"></i>Bank
              </div>
            </div>
            <input type="hidden" id="ep-mode" value="${p.mode || 'cash'}">
          </div>
          <div class="two-col">
            <div class="field">
              <label>Month</label>
              <select id="ep-mo">
                ${MONTHS.slice(0, CURRENT_MONTH).map((mo, i) => `<option value="${i}"${p.month === i ? ' selected' : ''}>${mo} 2026</option>`).join('')}
              </select>
            </div>
            <div class="field">
              <label>Amount</label>
              <input type="number" id="ep-amt" value="${p.amount}" inputmode="numeric">
            </div>
          </div>
          <div class="two-col">
            <div class="field">
              <label>Receipt no.</label>
              <input type="text" id="ep-rec" value="${p.receipt}">
            </div>
            <div class="field">
              <label>Date</label>
              <input type="date" id="ep-dt" value="${p.date}">
            </div>
          </div>
          <div class="field">
            <label>Note</label>
            <input type="text" id="ep-note" value="${(p.note || '').replace(/"/g, '&quot;')}">
          </div>
          <div class="err" id="ep-err"></div>
        </div>
        <div class="sheet-footer">
          <button class="btn" onclick="closeSheetDirect()">Cancel</button>
          <button class="btn primary" onclick="updatePayment(${pid})">Save</button>
        </div>
      </div>
    </div>`;
  }, 100);
}

function selectEditPayMode(mode) {
  document.getElementById('ep-mode').value = mode;
  document.getElementById('ep-mode-cash').classList.toggle('active', mode === 'cash');
  document.getElementById('ep-mode-bank').classList.toggle('active', mode === 'bank');
}

function updatePayment(pid) {
  const p = getPayment(pid);
  const mid = parseInt(document.getElementById('ep-m').value);
  const mo = parseInt(document.getElementById('ep-mo').value);
  const amt = parseInt(document.getElementById('ep-amt').value);
  const rec = document.getElementById('ep-rec').value.trim();
  const dt = document.getElementById('ep-dt').value;
  const mode = document.getElementById('ep-mode').value;
  const note = document.getElementById('ep-note').value.trim();
  const err = document.getElementById('ep-err');
  
  if (!amt || amt <= 0) { err.textContent = 'Enter a valid amount'; err.style.display = 'block'; return; }
  if (payments.find(x => x.id !== pid && x.memberId === mid && x.month === mo)) {
    err.textContent = 'Already recorded for this month'; err.style.display = 'block'; return;
  }
  
  p.memberId = mid; p.month = mo; p.amount = amt; p.receipt = rec;
  p.date = dt; p.mode = mode; p.note = note;
  saveData();
  closeSheetDirect();
  render();
  showToast('Payment updated \u2713', 'success');
}

function deletePayment(pid) {
  const p = getPayment(pid);
  const m = getMember(p.memberId);
  if (!confirm(`Delete payment of ${rupee(p.amount)} from ${m.name} for ${MONTHS[p.month]}?\n\nThis cannot be undone.`)) return;
  payments = payments.filter(x => x.id !== pid);
  saveData();
  closeSheetDirect();
  render();
  showToast('Payment deleted', 'error');
}

// EXPENSES ===========================================
function openExpenseModal() {
  currentAttachment = null;
  const today = new Date().toISOString().split('T')[0];
  const root = document.getElementById('modal-root');
  root.innerHTML = `
  <div class="modal-wrap" onclick="closeSheet(event)">
    <div class="modal-sheet" onclick="event.stopPropagation()">
      <div class="sheet-handle"></div>
      <div class="sheet-title">
        Add expense
        <button onclick="closeSheetDirect()" style="background:none;border:none;cursor:pointer;color:#6A6A65;padding:4px"><i class="ti ti-x" style="font-size:22px"></i></button>
      </div>
      <div class="sheet-body">
        <div class="field">
          <label>Title *</label>
          <input type="text" id="ex-title" placeholder="e.g. Watchman salary - May">
        </div>
        <div class="two-col">
          <div class="field">
            <label>Category</label>
            <select id="ex-cat">
              <option value="Salary">Salary</option>
              <option value="Cleaning">Cleaning</option>
              <option value="Electricity">Electricity</option>
              <option value="Water">Water</option>
              <option value="Repairs">Repairs</option>
              <option value="Security">Security</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="field">
            <label>Amount (\u20B9) *</label>
            <input type="number" id="ex-amt" inputmode="numeric">
          </div>
        </div>
        <div class="two-col">
          <div class="field">
            <label>Date</label>
            <input type="date" id="ex-dt" value="${today}">
          </div>
          <div class="field">
            <label>Paid from</label>
            <select id="ex-source">
              <option value="cash">Cash</option>
              <option value="bank">Bank</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label>Note (optional)</label>
          <textarea id="ex-note" placeholder="Additional details"></textarea>
        </div>
        <div class="field">
          <label>Receipt photo (optional)</label>
          <div class="attachment-zone" id="ex-att-zone" onclick="document.getElementById('ex-attachment').click()">
            <i class="ti ti-camera-plus"></i>
            <div style="font-size:13px;font-weight:500">Attach receipt</div>
          </div>
          <input type="file" id="ex-attachment" accept="image/*" style="display:none" onchange="handleAttachment(event)">
        </div>
        <div class="err" id="ex-err"></div>
      </div>
      <div class="sheet-footer">
        <button class="btn" onclick="closeSheetDirect()">Cancel</button>
        <button class="btn primary" onclick="saveExpense()">Save</button>
      </div>
    </div>
  </div>`;
}

function saveExpense() {
  const title = document.getElementById('ex-title').value.trim();
  const cat = document.getElementById('ex-cat').value;
  const amt = parseInt(document.getElementById('ex-amt').value);
  const dt = document.getElementById('ex-dt').value;
  const source = document.getElementById('ex-source').value;
  const note = document.getElementById('ex-note').value.trim();
  const err = document.getElementById('ex-err');
  
  if (!title) { err.textContent = 'Title required'; err.style.display = 'block'; return; }
  if (!amt || amt <= 0) { err.textContent = 'Enter valid amount'; err.style.display = 'block'; return; }
  
  const iconMap = {
    'Salary': 'wallet', 'Cleaning': 'spray', 'Electricity': 'bolt',
    'Water': 'droplet', 'Repairs': 'tools', 'Security': 'shield', 'Other': 'cash'
  };
  
  expenses.push({
    id: nextId++, title, category: cat, amount: amt, date: dt,
    source, note, attachment: currentAttachment,
    icon: iconMap[cat] || 'cash'
  });
  
  if (source === 'bank') bankBalance -= amt;
  
  saveData();
  closeSheetDirect();
  render();
  showToast('Expense recorded \u2713', 'success');
}

function openExpenseDetail(eid) {
  const e = expenses.find(x => x.id === eid);
  const root = document.getElementById('modal-root');
  root.innerHTML = `
  <div class="modal-wrap" onclick="closeSheet(event)">
    <div class="modal-sheet" onclick="event.stopPropagation()">
      <div class="sheet-handle"></div>
      <div class="sheet-title">
        Expense details
        <button onclick="closeSheetDirect()" style="background:none;border:none;cursor:pointer;color:#6A6A65;padding:4px"><i class="ti ti-x" style="font-size:22px"></i></button>
      </div>
      <div class="sheet-body">
        <div class="receipt-preview">
          <div class="head">${e.title}</div>
          <div class="summary-row"><span style="color:#6A6A65">Category</span><span>${e.category}</span></div>
          <div class="summary-row"><span style="color:#6A6A65">Date</span><span>${formatDate(e.date)}</span></div>
          <div class="summary-row"><span style="color:#6A6A65">Paid from</span><span>${e.source === 'cash' ? 'Cash' : 'Bank'}</span></div>
          ${e.note ? `<div class="summary-row"><span style="color:#6A6A65">Note</span><span style="text-align:right;max-width:200px">${e.note}</span></div>` : ''}
          <div class="summary-row total"><span>Amount</span><span style="color:#A32D2D">-${rupee(e.amount)}</span></div>
        </div>
        ${e.attachment ? `<img src="${e.attachment}" style="width:100%;border-radius:10px;border:1px solid #E8E7E1">` : ''}
      </div>
      <div class="sheet-footer">
        <button class="btn danger" style="flex:1" onclick="deleteExpense(${eid})"><i class="ti ti-trash"></i> Delete</button>
        <button class="btn primary" style="flex:1" onclick="closeSheetDirect()">Close</button>
      </div>
    </div>
  </div>`;
}

function deleteExpense(eid) {
  const e = expenses.find(x => x.id === eid);
  if (!confirm(`Delete expense "${e.title}"?`)) return;
  if (e.source === 'bank') bankBalance += e.amount;
  expenses = expenses.filter(x => x.id !== eid);
  saveData();
  closeSheetDirect();
  render();
  showToast('Expense deleted', 'error');
}

// BANK ===============================================
function openBankModal(action) {
  const titleMap = {add: 'Add to bank', subtract: 'Withdraw from bank', set: 'Set bank balance'};
  const root = document.getElementById('modal-root');
  root.innerHTML = `
  <div class="modal-wrap" onclick="closeSheet(event)">
    <div class="modal-sheet" onclick="event.stopPropagation()">
      <div class="sheet-handle"></div>
      <div class="sheet-title">
        ${titleMap[action]}
        <button onclick="closeSheetDirect()" style="background:none;border:none;cursor:pointer;color:#6A6A65;padding:4px"><i class="ti ti-x" style="font-size:22px"></i></button>
      </div>
      <div class="sheet-body">
        <div style="text-align:center;padding:8px 0 16px">
          <div style="font-size:11px;color:#6A6A65;margin-bottom:4px">Current balance</div>
          <div style="font-size:24px;font-weight:600;color:#0F6E56">${rupee(bankBalance)}</div>
        </div>
        <div class="field">
          <label>Amount (\u20B9) *</label>
          <input type="number" id="bk-amt" inputmode="numeric" placeholder="0" autofocus>
        </div>
        <div class="field">
          <label>Note (optional)</label>
          <input type="text" id="bk-note" placeholder="${action === 'add' ? 'e.g. Cash deposit' : action === 'subtract' ? 'e.g. ATM withdrawal' : 'e.g. Opening balance'}">
        </div>
        <div class="err" id="bk-err"></div>
      </div>
      <div class="sheet-footer">
        <button class="btn" onclick="closeSheetDirect()">Cancel</button>
        <button class="btn primary" onclick="updateBank('${action}')">${action === 'set' ? 'Set' : action === 'add' ? 'Add' : 'Withdraw'}</button>
      </div>
    </div>
  </div>`;
  setTimeout(() => document.getElementById('bk-amt')?.focus(), 250);
}

function updateBank(action) {
  const amt = parseInt(document.getElementById('bk-amt').value);
  const err = document.getElementById('bk-err');
  if (!amt || amt < 0) { err.textContent = 'Enter a valid amount'; err.style.display = 'block'; return; }
  
  if (action === 'add') bankBalance += amt;
  else if (action === 'subtract') bankBalance -= amt;
  else if (action === 'set') bankBalance = amt;
  
  saveData();
  closeSheetDirect();
  render();
  showToast('Bank balance updated \u2713', 'success');
}

// BACKUP =============================================
function exportData() {
  const data = { members, payments, expenses, bankBalance, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `ruby-society-backup-${new Date().toISOString().split('T')[0]}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('Backup downloaded \u2713', 'success');
}

function closeSheet(e) { if (e.target === e.currentTarget) closeSheetDirect(); }
function closeSheetDirect() { document.getElementById('modal-root').innerHTML = ''; }

render();
</script>
