<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1A2456">
<meta name="mobile-web-app-capable" content="yes">
<title>Ruby Social Society</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.6.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#F4F3EE;color:#1A1A19;overflow-x:hidden}
.shell{max-width:480px;margin:0 auto;min-height:100vh;background:#F4F3EE;padding-bottom:80px}
.loading-screen{position:fixed;inset:0;background:#1A2456;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;transition:opacity 0.4s}
.loading-screen.hidden{opacity:0;pointer-events:none}
.loading-title{font-size:20px;font-weight:700;color:#fff;margin-bottom:6px}
.loading-sub{font-size:12px;color:rgba(255,255,255,0.6);margin-bottom:30px}
.loading-spinner{width:32px;height:32px;border:3px solid rgba(255,255,255,0.2);border-top-color:#fff;border-radius:50%;animation:spin 0.8s linear infinite}
.loading-status{font-size:11px;color:rgba(255,255,255,0.5);margin-top:12px}
@keyframes spin{to{transform:rotate(360deg)}}
.topbar{background:#1A2456;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
.topbar-left .title{font-size:15px;font-weight:600;color:#fff;display:flex;align-items:center;gap:6px}
.topbar-left .sub{font-size:10px;color:rgba(255,255,255,0.55);margin-top:2px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#666;display:inline-block;margin-left:6px}
.sync-dot.online{background:#4ADE80}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid #E0DED8;display:grid;grid-template-columns:repeat(3,1fr);z-index:10;padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px))}
.nav-item{display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:3px;border:none;background:none;cursor:pointer;color:#6A6A65;font-size:10px;font-family:inherit}
.nav-item i{font-size:22px}
.nav-item.active{color:#1A2456;font-weight:600}
.card{background:#fff;border:1px solid #E0DED8;border-radius:12px;margin:0 12px 10px;overflow:hidden}
.card-header{padding:12px 14px;border-bottom:1px solid #E8E7E1;display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:13px;font-weight:600}
.bal-badges{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 12px 0}
.bal-badge{background:#2A2A2A;border-radius:10px;padding:10px 12px}
.bal-badge-label{font-size:9px;color:rgba(255,255,255,0.55);font-weight:600;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:3px}
.bal-badge-val{font-size:17px;font-weight:700;color:#fff;margin-bottom:8px}
.bal-badge-actions{display:flex;gap:4px}
.bal-badge-actions button{flex:1;padding:5px;background:rgba(255,255,255,0.12);color:rgba(255,255,255,0.85);border:1px solid rgba(255,255,255,0.15);border-radius:6px;font-size:10px;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:2px}
.bal-badge-actions button:active{background:rgba(255,255,255,0.25)}
.lg-controls{display:flex;gap:8px;align-items:center;padding:10px 12px}
.lg-search{flex:1;padding:9px 12px;border:1px solid #D8D6CB;border-radius:8px;background:#F8F7F2;font-size:13px;font-family:inherit;outline:none;color:#1A1A19}
.lg-search:focus{border-color:#1A2456;background:#fff}
.lg-month-nav{display:flex;align-items:center;border:1px solid #D8D6CB;border-radius:8px;overflow:hidden;background:#fff;flex-shrink:0}
.lg-month-nav button{background:#F0EFE9;border:none;cursor:pointer;color:#1A2456;font-size:16px;width:30px;height:36px;display:flex;align-items:center;justify-content:center;font-weight:700}
.lg-month-nav button:active{background:#DDE8D8}
.lg-month-label{font-size:12px;font-weight:600;color:#1A1A19;padding:0 10px;border-left:1px solid #E8E7E1;border-right:1px solid #E8E7E1;height:36px;display:flex;align-items:center;white-space:nowrap}
.lg-tabs{display:flex;gap:0;background:#fff;border:1px solid #E0DED8;border-radius:8px;overflow:hidden;margin:0 12px 10px}
.lg-tab{flex:1;padding:8px;text-align:center;font-size:11px;font-weight:600;cursor:pointer;background:#F8F7F2;color:#6A6A65;border:none;font-family:inherit;border-right:1px solid #E0DED8}
.lg-tab:last-child{border-right:none}
.lg-tab.active{background:#1A2456;color:#fff}
.lg-table{background:#fff;border:1px solid #D8D6CB;border-radius:10px;overflow:hidden;margin:0 12px 10px}
.lg-th{padding:10px 12px;font-size:13px;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:space-between}
.lg-th.all{background:#1A2456}.lg-th.inc{background:#1D6B3E}.lg-th.exp{background:#6B1D1D}.lg-th.bnk{background:#185FA5}.lg-th.csh{background:#854F0B}
.lg-colh{display:grid;grid-template-columns:34px 1fr 28px 54px;padding:5px 8px;font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:#6A6A65;background:#F0EFE9;border-bottom:1px solid #E0DED8}
.lg-colh span:nth-child(3){text-align:center}.lg-colh span:nth-child(4){text-align:right}
.lg-row{display:grid;grid-template-columns:34px 1fr 28px 54px;border-bottom:1px solid #F0EFE9;align-items:center;min-height:40px;cursor:pointer}
.lg-row:last-of-type{border-bottom:none}.lg-row:active{background:#F4F3EE}.lg-row.auto{background:#F0FAF5}
.lg-row>div{padding:7px 6px}
.lg-r-date{font-size:9px;color:#6A6A65;padding-left:8px!important}
.lg-r-desc{font-size:11px;color:#1A1A19;font-weight:500}
.lg-r-desc small{font-size:9px;color:#ABABA3;display:block;font-weight:400}
.lg-r-mode{text-align:center;font-size:13px}
.lg-r-amt{font-size:11px;font-weight:700;text-align:right;padding-right:8px!important;white-space:nowrap}
.lg-r-amt.inc{color:#1D6B3E}.lg-r-amt.exp{color:#A32D2D}
.lg-add-row{display:flex;align-items:center;justify-content:center;gap:5px;padding:10px;font-size:12px;font-weight:500;cursor:pointer;border-top:1px dashed #D8D6CB;background:#FAFAF8;color:#1A2456}
.lg-add-row:active{background:#F0EFE9}
.lg-tf{padding:10px 12px;display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:#fff}
.lg-tf.all{background:#1A2456}.lg-tf.inc{background:#1D6B3E}.lg-tf.exp{background:#6B1D1D}
.lg-sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 12px 10px}
.lg-sum-box{background:#fff;border:1px solid #E0DED8;border-radius:10px;overflow:hidden}
.lg-sum-h{padding:9px 10px;font-weight:700;font-size:11px;color:#fff}
.lg-sum-h.bnk{background:#185FA5}.lg-sum-h.csh{background:#854F0B}
.lg-sum-r{display:flex;justify-content:space-between;padding:7px 10px;font-size:11px;border-bottom:1px solid #F0EFE9}
.lg-sum-r:last-child{border-bottom:none}
.lg-sum-r.closing{background:#F0FAF5;font-weight:700;border-top:1.5px solid #1D9E75}
.lg-sum-r.closing.csh{background:#FFF8ED;border-top-color:#D4A843}
.lg-total-card{margin:0 12px 12px;background:linear-gradient(135deg,#1A2456,#0F1740);border-radius:12px;padding:16px;text-align:center;color:#fff}
.lg-total-label{font-size:10px;text-transform:uppercase;letter-spacing:0.05em;opacity:0.7;margin-bottom:4px}
.lg-total-val{font-size:24px;font-weight:700}
.member-row{padding:12px 14px;border-bottom:1px solid #F0EFE9;display:flex;align-items:center;gap:12px;cursor:pointer}
.member-row:last-child{border-bottom:none}.member-row:active{background:#F4F3EE}
.avatar{width:36px;height:36px;border-radius:50%;background:#9FE1CB;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#085041;flex-shrink:0}
.avatar.rented{background:#FAC775;color:#633806}
.member-info{flex:1;min-width:0}
.member-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.member-flat{font-size:11px;color:#6A6A65;margin-top:1px}
.badge{display:inline-block;padding:2px 7px;border-radius:20px;font-size:9px;font-weight:500}
.badge.paid{background:#EAF3DE;color:#3B6D11}.badge.unpaid{background:#FCEBEB;color:#A32D2D}
.badge.owner{background:#E1F5EE;color:#0F6E56}.badge.rented{background:#FAEEDA;color:#854F0B}
.tick-btn{width:32px;height:32px;border-radius:50%;border:2px solid #D8D6CB;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;transition:all 0.2s}
.tick-btn.ticked{background:#1D6B3E;border-color:#1D6B3E;color:#fff}
.tick-btn:active{transform:scale(0.9)}
.search-wrap{padding:10px 14px;border-bottom:1px solid #E8E7E1}
.search-wrap input{width:100%;padding:9px 12px;border:1px solid #D8D6CB;border-radius:8px;background:#F8F7F2;color:#1A1A19;font-size:13px;font-family:inherit;outline:none}
.due-row{padding:12px 14px;border-bottom:1px solid #F0EFE9;display:flex;align-items:center;gap:10px}
.due-row:last-child{border-bottom:none}
.due-info{flex:1;min-width:0}
.due-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.due-sub{font-size:11px;color:#6A6A65;margin-top:1px}
.btn{padding:9px 14px;border:1px solid #D8D6CB;border-radius:8px;background:#fff;cursor:pointer;font-size:13px;font-family:inherit;color:#1A1A19}
.btn:active{background:#F4F3EE}
.btn.primary{background:#1A2456;border-color:#1A2456;color:#fff}.btn.primary:active{background:#0F1740}
.btn.danger{border-color:#F09595;color:#A32D2D}
.btn.whatsapp{background:#25D366;border-color:#25D366;color:#fff}
.btn.sm{padding:6px 10px;font-size:11px}
.btn.icon-only{padding:7px;min-width:32px;display:inline-flex;align-items:center;justify-content:center}
.modal-wrap{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn 0.15s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-sheet{background:#fff;border-radius:22px 22px 0 0;width:100%;max-width:480px;padding-bottom:env(safe-area-inset-bottom,16px);max-height:92vh;overflow-y:auto;animation:slideUp 0.2s}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-handle{width:38px;height:4px;background:#D8D6CB;border-radius:4px;margin:10px auto 14px}
.sheet-title{font-size:16px;font-weight:600;padding:0 16px 12px;border-bottom:1px solid #E8E7E1;display:flex;justify-content:space-between;align-items:center}
.sheet-body{padding:16px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:#6A6A65;margin-bottom:6px;font-weight:500}
.field input,.field select{width:100%;padding:12px;border:1px solid #D8D6CB;border-radius:10px;background:#F8F7F2;color:#1A1A19;font-size:15px;font-family:inherit;outline:none;-webkit-appearance:none;appearance:none}
.field input:focus,.field select:focus{border-color:#1A2456;background:#fff}
.field select{background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'%3e%3cpath d='M1 1.5L6 6.5L11 1.5' stroke='%236A6A65' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3e%3c/svg%3e");background-repeat:no-repeat;background-position:right 14px center;padding-right:36px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet-footer{padding:12px 16px 16px;display:flex;gap:10px;border-top:1px solid #E8E7E1}
.sheet-footer .btn{flex:1;padding:13px;font-size:15px;font-weight:500;text-align:center}
.err{color:#A32D2D;font-size:12px;margin-top:6px;display:none;background:#FCEBEB;padding:8px 10px;border-radius:6px}
.pay-mode-toggle{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pay-mode-btn{padding:12px;border:1px solid #D8D6CB;border-radius:10px;background:#F8F7F2;cursor:pointer;font-family:inherit;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:4px;color:#6A6A65}
.pay-mode-btn.active{background:#EAF3DE;border-color:#1D6B3E;color:#0F6E56}
.pay-mode-btn i{font-size:22px}
.empty{padding:40px 20px;text-align:center;color:#6A6A65;font-size:13px}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#1A2456;color:#fff;padding:12px 20px;border-radius:50px;font-size:13px;z-index:200;max-width:90%;text-align:center;animation:toastIn 0.3s}
.toast.success{background:#0F6E56}.toast.error{background:#A32D2D}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,20px)}to{opacity:1;transform:translate(-50%,0)}}
</style>
</head>
<body>
<div class="loading-screen" id="loadingScreen"><div style="font-size:40px;margin-bottom:14px">🏢</div><div class="loading-title">Ruby Social Society</div><div class="loading-sub">Third Floor · 2026</div><div class="loading-spinner"></div><div class="loading-status" id="loadingStatus">Connecting...</div></div>
<div class="shell">
<div class="topbar"><div class="topbar-left"><div class="title"><i class="ti ti-building"></i>Ruby Social Society<span class="sync-dot" id="syncDot"></span></div><div class="sub">Third Floor · 2026</div></div><button class="btn primary" style="padding:8px 16px;font-size:13px;border-radius:50px" onclick="openAddTx()"><i class="ti ti-plus"></i> Add</button></div>
<div class="content" id="content"></div>
<nav class="bottom-nav"><button class="nav-item active" onclick="showTab('sheet',this)"><i class="ti ti-report-money"></i>Sheet</button><button class="nav-item" onclick="showTab('members',this)"><i class="ti ti-users"></i>Members</button><button class="nav-item" onclick="showTab('dues',this)"><i class="ti ti-alert-circle"></i>Dues</button></nav>
<div id="modal-root"></div><div id="toast-root"></div>
</div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import{getFirestore,collection,doc,getDocs,setDoc,deleteDoc,onSnapshot,writeBatch,getDoc}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyA4RWgXHtf0TJnMWepLX50LwQc40TWGlxE",authDomain:"ruby-society.firebaseapp.com",projectId:"ruby-society",storageBucket:"ruby-society.firebasestorage.app",messagingSenderId:"947491347642",appId:"1:947491347642:web:fbe32bf64ff5d83f1f3683"});
const db=getFirestore(app);
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const CATS=['Maintenance','Repair Fund','Penalty','Water Charges','Electricity','Salary','Stationery','Cleaning','Water Tanker','Plumbing','Other'];
const MA=800;
let members=[],transactions=[],bankBalance=0,cashInHand=0;
let activeTab='sheet',bsMonth=new Date().getMonth(),bsYear=new Date().getFullYear(),bsView='all',bsSearch='';
let loaded={m:false,tx:false,s:false};
function rupee(n){return'\u20B9'+Number(n).toLocaleString('en-IN')}
function initials(n){return n.split(/[\s\/]/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()}
function newId(p){return p+'_'+Date.now()+'_'+Math.random().toString(36).substr(2,5)}
function setSyncDot(s){const d=document.getElementById('syncDot');if(d)d.className='sync-dot '+s}
function showToast(m,t){const r=document.getElementById('toast-root');r.innerHTML=`<div class="toast ${t||''}">${m}</div>`;setTimeout(()=>r.innerHTML='',2200)}
function mk(m,y){return`${y}-${String(m+1).padStart(2,'0')}`}
function getOpening(month,year){
  if(month===bsMonth&&year===bsYear){
    const pm=month===0?11:month-1,py=month===0?year-1:year;
    const pk=mk(pm,py);
    const prevTx=transactions.filter(t=>t.monthKey===pk&&!t.isCarryForward);
    if(prevTx.length===0)return{bank:bankBalance,cash:cashInHand};
    const prevOpen=month===0&&year<=2026?{bank:bankBalance,cash:cashInHand}:getOpeningRecurse(pm,py);
    const bi=prevTx.filter(t=>t.side==='income'&&t.method==='bank').reduce((s,t)=>s+t.amount,0);
    const be=prevTx.filter(t=>t.side==='expense'&&t.method==='bank').reduce((s,t)=>s+t.amount,0);
    const ci=prevTx.filter(t=>t.side==='income'&&t.method!=='bank').reduce((s,t)=>s+t.amount,0);
    const ce=prevTx.filter(t=>t.side==='expense'&&t.method!=='bank').reduce((s,t)=>s+t.amount,0);
    return{bank:prevOpen.bank+bi-be,cash:prevOpen.cash+ci-ce};
  }
  return{bank:bankBalance,cash:cashInHand};
}
function getOpeningRecurse(m,y){return{bank:bankBalance,cash:cashInHand}}
function sendWA(ph,msg){const c=(ph||'').replace(/\D/g,'');const n=c.length===10?'91'+c:c;window.open(n?`https://wa.me/${n}?text=${encodeURIComponent(msg)}`:`https://wa.me/?text=${encodeURIComponent(msg)}`,'_blank')}
function buildReminder(m){return['*Reminder*','Ruby Social Society','','Dear *'+m.name+'*,','Flat: '+m.flat,'','Your maintenance is pending. Kindly pay.','','Thank you','_- Management_'].join('\n')}
async function initFirebase(){
  document.getElementById('loadingStatus').textContent='Loading...';
  try{
    onSnapshot(collection(db,'members'),s=>{members=s.docs.map(d=>({id:d.id,...d.data()}));loaded.m=true;tryRender()});
    onSnapshot(collection(db,'balanceEntries'),s=>{transactions=s.docs.map(d=>({id:d.id,...d.data()}));loaded.tx=true;tryRender()});
    onSnapshot(doc(db,'settings','main'),s=>{if(s.exists()){bankBalance=s.data().bankBalance||0;cashInHand=s.data().cashInHand||0}loaded.s=true;tryRender()});
    await setDoc(doc(db,'settings','main'),{seeded:true},{merge:true});
    setTimeout(()=>document.getElementById('loadingScreen').classList.add('hidden'),800);
  }catch(e){document.getElementById('loadingStatus').textContent='Error: '+e.message}
}
function tryRender(){if(loaded.m&&loaded.tx&&loaded.s){setSyncDot('online');render()}}
window.showTab=function(t,b){activeTab=t;document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active'));b.classList.add('active');window.scrollTo(0,0);render()};
function render(){const el=document.getElementById('content');if(!el)return;if(activeTab==='sheet')el.innerHTML=renderSheet();else if(activeTab==='members')el.innerHTML=renderMembers();else el.innerHTML=renderDues()}
function renderSheet(){
  const mkey=mk(bsMonth,bsYear);const op=getOpening(bsMonth,bsYear);
  const allTx=transactions.filter(t=>t.monthKey===mkey&&!t.isCarryForward);
  let fil=[...allTx];
  if(bsSearch){const q=bsSearch.toLowerCase();fil=fil.filter(t=>(t.name||'').toLowerCase().includes(q)||(t.category||'').toLowerCase().includes(q))}
  if(bsView==='income')fil=fil.filter(t=>t.side==='income');
  else if(bsView==='expense')fil=fil.filter(t=>t.side==='expense');
  else if(bsView==='bank')fil=fil.filter(t=>t.method==='bank');
  else if(bsView==='cash')fil=fil.filter(t=>t.method!=='bank');
  fil.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const bi=allTx.filter(t=>t.side==='income'&&t.method==='bank').reduce((s,t)=>s+t.amount,0);
  const be=allTx.filter(t=>t.side==='expense'&&t.method==='bank').reduce((s,t)=>s+t.amount,0);
  const ci=allTx.filter(t=>t.side==='income'&&t.method!=='bank').reduce((s,t)=>s+t.amount,0);
  const ce=allTx.filter(t=>t.side==='expense'&&t.method!=='bank').reduce((s,t)=>s+t.amount,0);
  const cb=op.bank+bi-be,cc=op.cash+ci-ce,ti=bi+ci,te=be+ce,tf=cb+cc;
  const vc={all:'all',income:'inc',expense:'exp',bank:'bnk',cash:'csh'};
  return`<div class="bal-badges"><div class="bal-badge"><div class="bal-badge-label">🏦 Bank Balance</div><div class="bal-badge-val">${rupee(op.bank)}</div><div class="bal-badge-actions"><button onclick="openBalModal('bank','add')"><i class="ti ti-plus" style="font-size:12px"></i>Add</button><button onclick="openBalModal('bank','subtract')"><i class="ti ti-minus" style="font-size:12px"></i>Out</button><button onclick="openBalModal('bank','set')"><i class="ti ti-edit" style="font-size:12px"></i>Set</button></div></div><div class="bal-badge"><div class="bal-badge-label">💵 Cash on Hand</div><div class="bal-badge-val">${rupee(op.cash)}</div><div class="bal-badge-actions"><button onclick="openBalModal('cash','add')"><i class="ti ti-plus" style="font-size:12px"></i>Add</button><button onclick="openBalModal('cash','subtract')"><i class="ti ti-minus" style="font-size:12px"></i>Out</button><button onclick="openBalModal('cash','set')"><i class="ti ti-edit" style="font-size:12px"></i>Set</button></div></div></div>
  <div class="lg-controls"><input class="lg-search" placeholder="Search..." value="${bsSearch}" oninput="bsSearch=this.value;render()"><div class="lg-month-nav"><button onclick="bsNav(-1)">\u2039</button><span class="lg-month-label">${MN[bsMonth]} ${bsYear}</span><button onclick="bsNav(1)">\u203A</button></div></div>
  <div class="lg-tabs"><button class="lg-tab ${bsView==='all'?'active':''}" onclick="bsSetView('all')">All</button><button class="lg-tab ${bsView==='income'?'active':''}" onclick="bsSetView('income')">Income</button><button class="lg-tab ${bsView==='expense'?'active':''}" onclick="bsSetView('expense')">Expense</button><button class="lg-tab ${bsView==='bank'?'active':''}" onclick="bsSetView('bank')">Bank</button><button class="lg-tab ${bsView==='cash'?'active':''}" onclick="bsSetView('cash')">Cash</button></div>
  <div class="lg-table"><div class="lg-th ${vc[bsView]||'all'}"><span><i class="ti ti-list"></i> ${MN[bsMonth]} ${bsYear} Ledger</span><span style="font-size:11px;opacity:0.8">${fil.length} entries</span></div><div class="lg-colh"><span>Date</span><span>Particulars</span><span>Mode</span><span>Amount</span></div>${fil.map(t=>`<div class="lg-row" onclick="openTxDetail('${t.id}')"><div class="lg-r-date">${t.date?t.date.split('-').reverse().slice(0,2).join('/'):'\u2014'}</div><div class="lg-r-desc">${t.name}<small>${t.category||''}</small></div><div class="lg-r-mode">${t.method==='bank'?'🏦':'💵'}</div><div class="lg-r-amt ${t.side==='income'?'inc':'exp'}">${t.side==='income'?'+':'-'}${rupee(t.amount)}</div></div>`).join('')}${fil.length===0?'<div style="padding:24px;text-align:center;font-size:12px;color:#ABABA3">No transactions</div>':''}<div class="lg-add-row" onclick="openAddTx()"><i class="ti ti-plus"></i> Add Transaction</div><div class="lg-tf ${vc[bsView]||'all'}"><span>Net: ${rupee(ti-te)}</span><span>Total: ${rupee(ti+te)}</span></div></div>
  <div class="lg-sum-grid"><div class="lg-sum-box"><div class="lg-sum-h bnk">🏦 Bank Summary</div><div class="lg-sum-r"><span style="color:#6A6A65">Opening</span><span>${rupee(op.bank)}</span></div><div class="lg-sum-r"><span style="color:#1D6B3E">+ Income</span><span style="color:#1D6B3E">${rupee(bi)}</span></div><div class="lg-sum-r"><span style="color:#A32D2D">- Expense</span><span style="color:#A32D2D">${rupee(be)}</span></div><div class="lg-sum-r closing"><span>Closing</span><span style="color:#155230">${rupee(cb)}</span></div></div><div class="lg-sum-box"><div class="lg-sum-h csh">💵 Cash Summary</div><div class="lg-sum-r"><span style="color:#6A6A65">Opening</span><span>${rupee(op.cash)}</span></div><div class="lg-sum-r"><span style="color:#1D6B3E">+ Income</span><span style="color:#1D6B3E">${rupee(ci)}</span></div><div class="lg-sum-r"><span style="color:#A32D2D">- Expense</span><span style="color:#A32D2D">${rupee(ce)}</span></div><div class="lg-sum-r closing csh"><span>Closing</span><span style="color:#854F0B">${rupee(cc)}</span></div></div></div>
  <div class="lg-total-card"><div class="lg-total-label">Total Available Funds (Bank + Cash)</div><div class="lg-total-val">${rupee(tf)}</div></div>`;
}
function renderMembers(){
  const mkey=mk(bsMonth,bsYear);
  return`<div style="padding:12px 14px 8px;display:flex;align-items:center;justify-content:space-between"><div style="font-size:15px;font-weight:700">Members (${members.length})</div><div style="display:flex;gap:6px"><div class="lg-month-nav" style="margin-right:4px"><button onclick="bsNav(-1)">\u2039</button><span class="lg-month-label">${MN[bsMonth]}</span><button onclick="bsNav(1)">\u203A</button></div><button class="btn sm primary" onclick="openAddMember()"><i class="ti ti-plus"></i></button></div></div>
  <div class="card" style="margin-top:0"><div class="search-wrap"><input type="search" placeholder="Search..." oninput="filterMembers(this.value)"></div><div id="mlist">${members.map(m=>{const ticked=transactions.some(t=>t.monthKey===mkey&&t.tickMemberId===m.id);return`<div class="member-row" id="mr${m.id}"><button class="tick-btn ${ticked?'ticked':''}" onclick="event.stopPropagation();toggleTick('${m.id}','${mkey}')">${ticked?'<i class="ti ti-check"></i>':''}</button><div class="avatar ${m.type==='rented'?'rented':''}">${initials(m.name)}</div><div class="member-info" onclick="openEditMember('${m.id}')"><div class="member-name">${m.name} <span class="badge ${m.type}">${m.type==='owner'?'Owner':'Tenant'}</span></div><div class="member-flat">Flat ${m.flat}${m.phone?' · '+m.phone:''}</div></div><span class="badge ${ticked?'paid':'unpaid'}">${ticked?'Paid':'Due'}</span></div>`}).join('')}</div></div>`;
}
function renderDues(){
  const mkey=mk(bsMonth,bsYear);const unpaid=members.filter(m=>!transactions.some(t=>t.monthKey===mkey&&t.tickMemberId===m.id));
  return`<div style="padding:12px 14px 8px;display:flex;align-items:center;justify-content:space-between"><div style="font-size:15px;font-weight:700">Dues \u2014 ${MN[bsMonth]} ${bsYear}</div><div class="lg-month-nav"><button onclick="bsNav(-1)">\u2039</button><span class="lg-month-label">${MN[bsMonth]}</span><button onclick="bsNav(1)">\u203A</button></div></div>
  <div style="padding:0 12px 8px;font-size:12px;color:#6A6A65">${unpaid.length} pending · ${members.length-unpaid.length} paid</div>
  <div class="card" style="margin-top:0">${unpaid.length===0?'<div class="empty"><i class="ti ti-circle-check" style="font-size:32px;display:block;margin-bottom:8px;color:#1D6B3E"></i>All members paid!</div>':unpaid.map(m=>`<div class="due-row"><div class="avatar ${m.type==='rented'?'rented':''}">${initials(m.name)}</div><div class="due-info"><div class="due-name">${m.name}</div><div class="due-sub">Flat ${m.flat} · ${rupee(MA)}</div></div><button class="btn sm icon-only whatsapp" onclick="sendWA('${m.phone||''}',buildReminder(members.find(x=>x.id==='${m.id}')))"><i class="ti ti-brand-whatsapp"></i></button><button class="btn sm primary" onclick="toggleTick('${m.id}','${mk(bsMonth,bsYear)}')"><i class="ti ti-check"></i></button></div>`).join('')}</div>`;
}
// MODALS
window.openAddTx=function(){const mkey=mk(bsMonth,bsYear);document.getElementById('modal-root').innerHTML=`<div class="modal-wrap" onclick="closeSheet(event)"><div class="modal-sheet" onclick="event.stopPropagation()"><div class="sheet-handle"></div><div class="sheet-title"><span>Add Transaction</span><button onclick="closeM()" style="background:none;border:none;cursor:pointer;color:#6A6A65;padding:4px"><i class="ti ti-x" style="font-size:22px"></i></button></div><div class="sheet-body"><div class="field"><label>Date *</label><input type="date" id="tx-date" value="${bsYear}-${String(bsMonth+1).padStart(2,'0')}-${String(new Date().getDate()).padStart(2,'0')}"></div><div class="field"><label>Particulars *</label><input type="text" id="tx-name" placeholder="e.g. Maintenance, Electric Bill"></div><div class="field"><label>Type *</label><div class="pay-mode-toggle"><div class="pay-mode-btn active" id="tx-t-inc" onclick="selTxType('income')" style="border-color:#1D6B3E"><i class="ti ti-trending-up" style="color:#1D6B3E"></i>Income</div><div class="pay-mode-btn" id="tx-t-exp" onclick="selTxType('expense')" style="border-color:#A32D2D"><i class="ti ti-trending-down" style="color:#A32D2D"></i>Expense</div></div><input type="hidden" id="tx-type" value="income"></div><div class="field"><label>Mode *</label><div class="pay-mode-toggle"><div class="pay-mode-btn active" id="tx-m-cash" onclick="selTxMode('cash')"><i class="ti ti-cash"></i>Cash</div><div class="pay-mode-btn" id="tx-m-bank" onclick="selTxMode('bank')"><i class="ti ti-building-bank"></i>Bank</div></div><input type="hidden" id="tx-mode" value="cash"></div><div class="field"><label>Category</label><select id="tx-cat">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></div><div class="field"><label>Amount (\u20B9) *</label><input type="number" id="tx-amt" inputmode="numeric" placeholder="0" style="font-size:20px;font-weight:600"></div><div class="field"><label>Remarks</label><input type="text" id="tx-note" placeholder="Optional"></div><div class="err" id="tx-err"></div></div><div class="sheet-footer"><button class="btn" onclick="closeM()">Cancel</button><button class="btn primary" onclick="saveTx('${mkey}')">Save</button></div></div></div>`};
window.selTxType=function(t){document.getElementById('tx-type').value=t;const i=document.getElementById('tx-t-inc'),e=document.getElementById('tx-t-exp');i.classList.toggle('active',t==='income');i.style.background=t==='income'?'#EAF3DE':'';i.style.color=t==='income'?'#1D6B3E':'';e.classList.toggle('active',t==='expense');e.style.background=t==='expense'?'#FCEBEB':'';e.style.color=t==='expense'?'#A32D2D':''};
window.selTxMode=function(m){document.getElementById('tx-mode').value=m;document.getElementById('tx-m-cash').classList.toggle('active',m==='cash');document.getElementById('tx-m-bank').classList.toggle('active',m==='bank')};
window.saveTx=async function(mkey){const date=document.getElementById('tx-date').value,name=document.getElementById('tx-name').value.trim(),side=document.getElementById('tx-type').value,method=document.getElementById('tx-mode').value,cat=document.getElementById('tx-cat').value,amt=parseInt(document.getElementById('tx-amt').value),note=document.getElementById('tx-note').value.trim(),err=document.getElementById('tx-err');if(!date){err.textContent='Date required';err.style.display='block';return}if(!name){err.textContent='Description required';err.style.display='block';return}if(!amt||amt<=0){err.textContent='Amount must be positive';err.style.display='block';return}setSyncDot('syncing');await setDoc(doc(db,'balanceEntries',newId('TX')),{side,monthKey:mkey,name,date,amount:amt,category:cat,method,note,createdAt:new Date().toISOString()});setSyncDot('online');closeM();showToast('Saved \u2713','success')};
window.openTxDetail=function(id){const t=transactions.find(x=>x.id===id);if(!t)return;const isE=t.side==='expense';document.getElementById('modal-root').innerHTML=`<div class="modal-wrap" onclick="closeSheet(event)"><div class="modal-sheet" onclick="event.stopPropagation()"><div class="sheet-handle"></div><div class="sheet-title">Transaction<button onclick="closeM()" style="background:none;border:none;cursor:pointer;color:#6A6A65;padding:4px"><i class="ti ti-x" style="font-size:22px"></i></button></div><div class="sheet-body"><div style="background:#F8F7F2;border-radius:12px;padding:16px"><div style="font-size:16px;font-weight:600;margin-bottom:8px">${t.name}</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px;margin-bottom:12px"><div><span style="color:#6A6A65">Date:</span> ${t.date||'\u2014'}</div><div><span style="color:#6A6A65">Type:</span> <span style="color:${isE?'#A32D2D':'#1D6B3E'};font-weight:600">${isE?'Expense':'Income'}</span></div><div><span style="color:#6A6A65">Mode:</span> ${t.method==='bank'?'🏦 Bank':'💵 Cash'}</div><div><span style="color:#6A6A65">Category:</span> ${t.category||'\u2014'}</div></div>${t.note?`<div style="font-size:12px;color:#6A6A65;padding:8px;background:#fff;border-radius:6px;margin-bottom:12px">\ud83d\udcdd ${t.note}</div>`:''}<div style="font-size:26px;font-weight:700;color:${isE?'#A32D2D':'#1D6B3E'}">${isE?'- ':'+ '}${rupee(t.amount)}</div></div></div><div class="sheet-footer"><button class="btn danger" onclick="deleteTx('${id}')"><i class="ti ti-trash"></i></button><button class="btn" onclick="editTx('${id}')"><i class="ti ti-edit"></i> Edit</button><button class="btn primary" onclick="closeM()">Close</button></div></div></div>`};
window.editTx=function(id){const t=transactions.find(x=>x.id===id);if(!t)return;closeM();setTimeout(()=>{document.getElementById('modal-root').innerHTML=`<div class="modal-wrap" onclick="closeSheet(event)"><div class="modal-sheet" onclick="event.stopPropagation()"><div class="sheet-handle"></div><div class="sheet-title">Edit<button onclick="closeM()" style="background:none;border:none;cursor:pointer;color:#6A6A65;padding:4px"><i class="ti ti-x" style="font-size:22px"></i></button></div><div class="sheet-body"><div class="field"><label>Date</label><input type="date" id="ed-date" value="${t.date||''}"></div><div class="field"><label>Description</label><input type="text" id="ed-name" value="${(t.name||'').replace(/"/g,'&quot;')}"></div><div class="two-col"><div class="field"><label>Type</label><select id="ed-type"><option value="income" ${t.side==='income'?'selected':''}>Income</option><option value="expense" ${t.side==='expense'?'selected':''}>Expense</option></select></div><div class="field"><label>Mode</label><select id="ed-mode"><option value="cash" ${t.method!=='bank'?'selected':''}>Cash</option><option value="bank" ${t.method==='bank'?'selected':''}>Bank</option></select></div></div><div class="field"><label>Category</label><select id="ed-cat">${CATS.map(c=>`<option ${t.category===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>Amount</label><input type="number" id="ed-amt" value="${t.amount}"></div><div class="field"><label>Notes</label><input type="text" id="ed-note" value="${(t.note||'').replace(/"/g,'&quot;')}"></div><div class="err" id="ed-err"></div></div><div class="sheet-footer"><button class="btn" onclick="closeM()">Cancel</button><button class="btn primary" onclick="updateTx('${id}')">Save</button></div></div></div>`},100)};
window.updateTx=async function(id){const amt=parseInt(document.getElementById('ed-amt').value),name=document.getElementById('ed-name').value.trim(),err=document.getElementById('ed-err');if(!name||!amt||amt<=0){err.textContent='Fill required fields';err.style.display='block';return}const t=transactions.find(x=>x.id===id);setSyncDot('syncing');await setDoc(doc(db,'balanceEntries',id),{...t,date:document.getElementById('ed-date').value,name,side:document.getElementById('ed-type').value,method:document.getElementById('ed-mode').value,category:document.getElementById('ed-cat').value,amount:amt,note:document.getElementById('ed-note').value.trim()});setSyncDot('online');closeM();showToast('Updated \u2713','success')};
window.deleteTx=async function(id){if(!confirm('Delete?'))return;setSyncDot('syncing');await deleteDoc(doc(db,'balanceEntries',id));setSyncDot('online');closeM();showToast('Deleted','error')};
window.openBalModal=function(type,action){const isB=type==='bank',cur=isB?bankBalance:cashInHand,titles={add:'Add to '+(isB?'Bank':'Cash'),subtract:'Withdraw from '+(isB?'Bank':'Cash'),set:'Set '+(isB?'Bank':'Cash')};document.getElementById('modal-root').innerHTML=`<div class="modal-wrap" onclick="closeSheet(event)"><div class="modal-sheet" onclick="event.stopPropagation()"><div class="sheet-handle"></div><div class="sheet-title">${titles[action]}<button onclick="closeM()" style="background:none;border:none;cursor:pointer;color:#6A6A65;padding:4px"><i class="ti ti-x" style="font-size:22px"></i></button></div><div class="sheet-body"><div style="text-align:center;padding:8px 0 16px"><div style="font-size:11px;color:#6A6A65">Current</div><div style="font-size:24px;font-weight:700;color:${isB?'#185FA5':'#854F0B'}">${rupee(cur)}</div></div><div class="field"><label>Amount (\u20B9)</label><input type="number" id="bal-amt" inputmode="numeric" placeholder="0"></div><div class="err" id="bal-err"></div></div><div class="sheet-footer"><button class="btn" onclick="closeM()">Cancel</button><button class="btn primary" onclick="updateBal('${type}','${action}')">Save</button></div></div></div>`;setTimeout(()=>document.getElementById('bal-amt')?.focus(),200)};
window.updateBal=async function(type,action){const amt=parseInt(document.getElementById('bal-amt').value),err=document.getElementById('bal-err');if(!amt||amt<0){err.textContent='Enter valid amount';err.style.display='block';return}if(type==='bank'){if(action==='add')bankBalance+=amt;else if(action==='subtract')bankBalance-=amt;else bankBalance=amt;await setDoc(doc(db,'settings','main'),{bankBalance},{merge:true})}else{if(action==='add')cashInHand+=amt;else if(action==='subtract')cashInHand-=amt;else cashInHand=amt;await setDoc(doc(db,'settings','main'),{cashInHand},{merge:true})}closeM();showToast('Updated \u2713','success')};
window.toggleTick=async function(mid,mkey){const ex=transactions.find(t=>t.monthKey===mkey&&t.tickMemberId===mid);setSyncDot('syncing');if(ex){await deleteDoc(doc(db,'balanceEntries',ex.id))}else{const m=members.find(x=>x.id===mid);await setDoc(doc(db,'balanceEntries',newId('TK')),{monthKey:mkey,tickMemberId:mid,side:'income',method:'cash',name:'Maintenance - '+(m?.name||''),amount:MA,category:'Maintenance',date:new Date().toISOString().split('T')[0],createdAt:new Date().toISOString()})}setSyncDot('online')};
window.openAddMember=function(){document.getElementById('modal-root').innerHTML=`<div class="modal-wrap" onclick="closeSheet(event)"><div class="modal-sheet" onclick="event.stopPropagation()"><div class="sheet-handle"></div><div class="sheet-title">Add Member<button onclick="closeM()" style="background:none;border:none;cursor:pointer;color:#6A6A65;padding:4px"><i class="ti ti-x" style="font-size:22px"></i></button></div><div class="sheet-body"><div class="field"><label>Name *</label><input type="text" id="nm-name" placeholder="Member name"></div><div class="two-col"><div class="field"><label>Flat *</label><input type="text" id="nm-flat" placeholder="301" inputmode="numeric"></div><div class="field"><label>Phone</label><input type="tel" id="nm-ph" placeholder="WhatsApp"></div></div><div class="field"><label>Type</label><div class="pay-mode-toggle"><div class="pay-mode-btn active" id="nm-t-own" onclick="selNmType('owner')"><i class="ti ti-home"></i>Owner</div><div class="pay-mode-btn" id="nm-t-ren" onclick="selNmType('rented')"><i class="ti ti-key"></i>Tenant</div></div><input type="hidden" id="nm-type" value="owner"></div><div class="err" id="nm-err"></div></div><div class="sheet-footer"><button class="btn" onclick="closeM()">Cancel</button><button class="btn primary" onclick="saveMember()">Add</button></div></div></div>`};
window.selNmType=function(t){document.getElementById('nm-type').value=t;document.getElementById('nm-t-own').classList.toggle('active',t==='owner');document.getElementById('nm-t-ren').classList.toggle('active',t==='rented')};
window.saveMember=async function(){const name=document.getElementById('nm-name').value.trim(),flat=document.getElementById('nm-flat').value.trim(),ph=document.getElementById('nm-ph').value.trim(),type=document.getElementById('nm-type').value,err=document.getElementById('nm-err');if(!name){err.textContent='Name required';err.style.display='block';return}if(!flat){err.textContent='Flat required';err.style.display='block';return}setSyncDot('syncing');await setDoc(doc(db,'members',newId('M')),{name,flat,phone:ph,type});setSyncDot('online');closeM();showToast('Added \u2713','success')};
window.openEditMember=function(id){const m=members.find(x=>x.id===id);if(!m)return;document.getElementById('modal-root').innerHTML=`<div class="modal-wrap" onclick="closeSheet(event)"><div class="modal-sheet" onclick="event.stopPropagation()"><div class="sheet-handle"></div><div class="sheet-title">Edit Member<button onclick="closeM()" style="background:none;border:none;cursor:pointer;color:#6A6A65;padding:4px"><i class="ti ti-x" style="font-size:22px"></i></button></div><div class="sheet-body"><div class="field"><label>Name</label><input type="text" id="em-name" value="${m.name.replace(/"/g,'&quot;')}"></div><div class="two-col"><div class="field"><label>Flat</label><input type="text" id="em-flat" value="${m.flat}"></div><div class="field"><label>Phone</label><input type="tel" id="em-ph" value="${m.phone||''}"></div></div><div class="field"><label>Type</label><div class="pay-mode-toggle"><div class="pay-mode-btn ${m.type==='owner'?'active':''}" id="em-t-own" onclick="selEmType('owner')"><i class="ti ti-home"></i>Owner</div><div class="pay-mode-btn ${m.type==='rented'?'active':''}" id="em-t-ren" onclick="selEmType('rented')"><i class="ti ti-key"></i>Tenant</div></div><input type="hidden" id="em-type" value="${m.type}"></div><div style="margin-top:14px;padding-top:14px;border-top:1px solid #E8E7E1"><button class="btn danger" style="width:100%" onclick="delMember('${id}')"><i class="ti ti-trash"></i> Delete</button></div><div class="err" id="em-err"></div></div><div class="sheet-footer"><button class="btn" onclick="closeM()">Cancel</button><button class="btn primary" onclick="updateMember('${id}')">Save</button></div></div></div>`};
window.selEmType=function(t){document.getElementById('em-type').value=t;document.getElementById('em-t-own').classList.toggle('active',t==='owner');document.getElementById('em-t-ren').classList.toggle('active',t==='rented')};
window.updateMember=async function(id){const name=document.getElementById('em-name').value.trim(),flat=document.getElementById('em-flat').value.trim(),ph=document.getElementById('em-ph').value.trim(),type=document.getElementById('em-type').value;if(!name||!flat)return;setSyncDot('syncing');await setDoc(doc(db,'members',id),{name,flat,phone:ph,type});setSyncDot('online');closeM();showToast('Updated \u2713','success')};
window.delMember=async function(id){if(!confirm('Delete this member?'))return;setSyncDot('syncing');await deleteDoc(doc(db,'members',id));setSyncDot('online');closeM();showToast('Deleted','error')};
window.filterMembers=function(q){members.forEach(m=>{const r=document.getElementById('mr'+m.id);if(r)r.style.display=(m.name.toLowerCase().includes(q.toLowerCase())||m.flat.includes(q))?'':'none'})};
window.bsNav=function(d){bsMonth+=d;if(bsMonth<0){bsMonth=11;bsYear--}if(bsMonth>11){bsMonth=0;bsYear++}bsSearch='';bsView='all';render()};
window.bsSetView=function(v){bsView=v;render()};
window.closeSheet=function(e){if(e.target===e.currentTarget)closeM()};
window.closeM=function(){document.getElementById('modal-root').innerHTML=''};
window.buildReminder=buildReminder;window.sendWA=sendWA;
initFirebase();
</script>
</body>
</html>
